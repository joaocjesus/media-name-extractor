<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Name Extractor</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0d0f18;
      --surface: #13151f;
      --border: #222535;
      --border-hover: #363a55;
      --text-primary: #e2e8f0;
      --text-secondary: #9aa3c2;
      --text-muted: #555e7a;
      --input-bg: #0d0f18;
      --output-text: #ffffff;
      --output-label: #555e7a;
      --btn-primary-bg: #3b82f6;
      --btn-primary-hover: #2563eb;
      --btn-primary-active: #1d4ed8;
      --btn-secondary-bg: #181b28;
      --btn-secondary-hover: #1f2234;
      --btn-secondary-text: #9aa3c2;
      --btn-secondary-text-hover: #d0d8f0;
      --btn-run-bg: #151d38;
      --btn-run-border: #253060;
      --btn-run-text: #88b8f5;
      --btn-run-hover-bg: #1a2445;
      --btn-run-hover-border: #2e3e70;
      --btn-run-hover-text: #aad0ff;
      --kbd-bg: #181b28;
      --kbd-border: #2e3350;
      --kbd-text: #60a5fa;
      --divider: #1e2235;
      --toggle-bg: #181b28;
      --toggle-border: #222535;
      --toggle-text: #9aa3c2;
      --shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
    }

    :root[data-theme="light"] {
      --bg: #f0f2f8;
      --surface: #ffffff;
      --border: #dde2f0;
      --border-hover: #b0b8d4;
      --text-primary: #1a1d2e;
      --text-secondary: #374060;
      --text-muted: #6b7499;
      --input-bg: #f8f9fc;
      --output-text: #111111;
      --output-label: #7b85a8;
      --btn-primary-bg: #3b82f6;
      --btn-primary-hover: #2563eb;
      --btn-primary-active: #1d4ed8;
      --btn-secondary-bg: #f0f2f8;
      --btn-secondary-hover: #e4e8f4;
      --btn-secondary-text: #374060;
      --btn-secondary-text-hover: #1a1d2e;
      --btn-run-bg: #eff6ff;
      --btn-run-border: #bfdbfe;
      --btn-run-text: #1d4ed8;
      --btn-run-hover-bg: #dbeafe;
      --btn-run-hover-border: #93c5fd;
      --btn-run-hover-text: #1e40af;
      --kbd-bg: #eff6ff;
      --kbd-border: #bfdbfe;
      --kbd-text: #2563eb;
      --divider: #e4e8f4;
      --toggle-bg: #eff6ff;
      --toggle-border: #bfdbfe;
      --toggle-text: #374060;
      --shadow: 0 24px 60px rgba(59, 130, 246, 0.08);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
      transition: background 0.2s;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 32px 10px 32px;
      width: 100%;
      max-width: 680px;
      box-shadow: var(--shadow);
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      color: var(--toggle-text);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      transition: border-color 0.15s, color 0.15s;
    }

    .theme-toggle:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .theme-toggle svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #input {
      flex: 1;
      height: 46px;
      padding: 0 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s, background 0.2s;
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    #input:focus {
      border-color: #3b82f6;
    }

    #goButton {
      height: 42px;
      padding: 0 22px;
      background: var(--btn-primary-bg);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
    }

    #goButton:hover {
      background: var(--btn-primary-hover);
    }

    #goButton:active {
      background: var(--btn-primary-active);
      transform: translateY(1px);
    }

    .options {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 28px;
      justify-content: space-between;
      position: relative;
    }

    .options-dropdown {
      position: relative;
    }

    .options-button {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .options-button svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.15s;
    }

    .options-button[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .options-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 10;
      min-width: 220px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .options-menu[hidden] {
      display: none;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      user-select: none;
      transition: color 0.15s;
    }

    .options-menu .option-label {
      padding: 8px;
      border-radius: 6px;
    }

    .option-label:hover {
      color: var(--text-primary);
    }

    .options-menu .option-label:hover {
      background: var(--btn-secondary-hover);
    }

    .option-label input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--input-bg);
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .option-label input[type="checkbox"]:checked {
      background: #3b82f6;
      border-color: #3b82f6;
    }

    .option-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .result-section {
      border-top: 1px solid var(--divider);
      padding-top: 24px;
      margin-bottom: 20px;
      min-height: 80px;
      transition: border-color 0.2s;
    }

    .result-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--output-label);
      margin-bottom: 10px;
      transition: color 0.2s;
    }

    #outputArea {
      font-size: 1rem;
      font-weight: 600;
      color: var(--output-text);
      line-height: 1.3;
      word-break: break-word;
      min-height: 2rem;
    }

    .clipboard-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-secondary {
      height: 36px;
      padding: 0 14px;
      background: var(--btn-secondary-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--btn-secondary-text);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: var(--btn-secondary-hover);
      color: var(--btn-secondary-text-hover);
      border-color: var(--border-hover);
    }

    .btn-secondary:active {
      transform: translateY(1px);
    }

    #runFromClipboardButton {
      background: var(--btn-run-bg);
      border-color: var(--btn-run-border);
      color: var(--btn-run-text);
      margin-left: auto;
    }

    #runFromClipboardButton:hover {
      background: var(--btn-run-hover-bg);
      border-color: var(--btn-run-hover-border);
      color: var(--btn-run-hover-text);
    }

    .shortcut-hint {
      font-size: 0.73rem;
      color: var(--text-muted);
      transition: color 0.2s;
      text-align: center;
    }

    .shortcut-hint kbd {
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 0.7rem;
      color: var(--kbd-text);
      transition: background 0.2s, border-color 0.2s;
    }

    #status {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #3b82f6;
      min-height: 2rem;
      line-height: 1.6;
      transition: color 0.15s;
      text-align: center;
    }

    #status.error {
      color: #f87171;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>Media Name Extractor</h1>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"></svg>
        <span id="themeLabel">Light mode</span>
      </button>
    </div>

    <div class="input-row">
      <input type="text" id="input" placeholder="Constantine.2005.BluRay.1080p.x264...">
      <button id="goButton">Go</button>
    </div>

    <div class="options">
      <button class="btn-secondary" id="pasteButton">Paste from clipboard</button>
      <div class="options-dropdown">
        <button class="btn-secondary options-button" id="optionsButton" aria-expanded="false" aria-controls="optionsMenu">
          Options
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
        <div class="options-menu" id="optionsMenu" hidden>
          <label class="option-label">
            <input type="checkbox" id="formatTitle" checked>
            Format title
          </label>
          <label class="option-label">
            <input type="checkbox" id="addYear" checked>
            Include year
          </label>
          <label class="option-label">
            <input type="checkbox" id="keepFileExt">
            Keep file extension
          </label>
        </div>
      </div>
    </div>

    <div class="result-section">
      <div class="result-label">Result</div>
      <div id="outputArea"></div>
    </div>

    <div class="clipboard-buttons">
      <button class="btn-secondary" id="copyButton">Copy to clipboard</button>
      <button class="btn-secondary" id="runFromClipboardButton">Run from clipboard</button>
    </div>

    <p class="shortcut-hint">Press <kbd>Ctrl+V</kbd> / <kbd>⌘V</kbd> anywhere to instantly Run from clipboard</p>

    <div id="status"></div>
  </div>

  <script src="bundle.js"></script>
</body>

</html>
